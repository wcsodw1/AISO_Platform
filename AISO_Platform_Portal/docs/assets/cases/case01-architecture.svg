<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-label="Target architecture: 4 + 1 heterogeneous AI platform in two phases">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#92e2ff" stroke-opacity=".05"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c8b875"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fdc91"/></marker>
  </defs>
  <rect width="960" height="640" rx="24" fill="#070a13"/>
  <rect width="960" height="640" rx="24" fill="url(#g)"/>
  <g font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">

    <!-- INTERNAL ZONE -->
    <rect x="28" y="28" width="612" height="584" rx="20" fill="#c8b875" fill-opacity=".04" stroke="#c8b875" stroke-opacity=".55"/>
    <text x="52" y="56" text-anchor="start" fill="#c8b875" font-size="12" font-weight="800" letter-spacing="2.4">INTERNAL AI ZONE · NO EXTERNAL CONNECTIVITY</text>

    <!-- switch -->
    <rect x="52" y="72" width="564" height="38" rx="12" fill="#0d1220" stroke="#7edcff" stroke-opacity=".5"/>
    <text x="334" y="96" fill="#bfeeff" font-size="14" font-weight="700" letter-spacing="1">NETWORK SWITCH  ·  2 × 400GbE per node</text>
    <path d="M118 110V132M262 110V132M406 110V132M550 110V132" stroke="#7edcff" stroke-opacity=".6" stroke-width="1.5" fill="none"/>

    <!-- hosts -->
    <g font-weight="700">
      <rect x="52" y="132" width="132" height="124" rx="14" fill="#0d1220" stroke="#f3efe5" stroke-opacity=".5"/>
      <rect x="196" y="132" width="132" height="124" rx="14" fill="#0d1220" stroke="#f3efe5" stroke-opacity=".3" stroke-dasharray="6 4"/>
      <rect x="340" y="132" width="132" height="124" rx="14" fill="#0d1220" stroke="#f3efe5" stroke-opacity=".3" stroke-dasharray="6 4"/>
      <rect x="484" y="132" width="132" height="124" rx="14" fill="#0d1220" stroke="#ffb454" stroke-opacity=".6" stroke-dasharray="6 4"/>
      <g fill="#c8b875" font-size="13" letter-spacing="2"><text x="118" y="156">X1</text><text x="262" y="156">X2</text><text x="406" y="156">X3</text><text x="550" y="156">X4 · STANDBY</text></g>
      <g fill="#bfeeff" font-size="11"><text x="118" y="176">Master + Worker</text><text x="262" y="176">Master + Worker</text><text x="406" y="176">Master + Worker</text><text x="550" y="176" fill="#ffd9a0">Worker only</text></g>
      <g fill="#f3efe5" font-size="15"><text x="118" y="204">8 × MI350X</text><text x="262" y="204">8 × MI350X</text><text x="406" y="204">8 × MI350X</text><text x="550" y="204">8 × MI350X</text></g>
      <g fill="#f3efe5" fill-opacity=".5" font-size="11" font-weight="600"><text x="118" y="222">288GB HBM3e</text><text x="262" y="222">288GB HBM3e</text><text x="406" y="222">288GB HBM3e</text><text x="550" y="222">288GB HBM3e</text></g>
      <g font-size="10" letter-spacing="1.6"><text x="118" y="244" fill="#c8b875">PHASE 1</text><text x="262" y="244" fill="#f3efe5" fill-opacity=".5">PHASE 2</text><text x="406" y="244" fill="#f3efe5" fill-opacity=".5">PHASE 2</text><text x="550" y="244" fill="#f3efe5" fill-opacity=".5">PHASE 2</text></g>
    </g>

    <!-- control plane bracket -->
    <rect x="52" y="268" width="420" height="32" rx="10" fill="#7edcff" fill-opacity=".07" stroke="#7edcff" stroke-opacity=".45"/>
    <text x="262" y="289" fill="#bfeeff" font-size="12" font-weight="700" letter-spacing="1">K8S CONTROL PLANE  ·  3 × MASTER (X1–X3)</text>
    <text x="550" y="289" fill="#ffd9a0" fill-opacity=".8" font-size="11" font-weight="600">compute only</text>

    <!-- AP -->
    <rect x="52" y="316" width="564" height="58" rx="12" fill="#0d1220" stroke="#c8b875" stroke-opacity=".6"/>
    <text x="334" y="341" fill="#f3efe5" font-size="15" font-weight="700">AP · COMPUTE POOL MANAGEMENT</text>
    <text x="334" y="361" fill="#f3efe5" fill-opacity=".55" font-size="11" font-weight="600">GPU allocation · model instance · replica · routing / load balance · health / failover</text>
    <line x1="334" y1="374" x2="334" y2="392" stroke="#c8b875" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>

    <!-- data layer -->
    <rect x="52" y="398" width="564" height="92" rx="14" fill="#0d1220" stroke="#f3efe5" stroke-opacity=".4" stroke-dasharray="6 4"/>
    <text x="72" y="420" text-anchor="start" fill="#c8b875" font-size="11" font-weight="800" letter-spacing="2.4">DATA LAYER</text>
    <g text-anchor="start" font-weight="700">
      <text x="72" y="448" fill="#f3efe5" font-size="14">Relational DB</text><text x="72" y="468" fill="#f3efe5" fill-opacity=".5" font-size="11" font-weight="600">Primary + Standby</text>
      <text x="252" y="448" fill="#f3efe5" font-size="14">Vector / RAG data</text><text x="252" y="468" fill="#f3efe5" fill-opacity=".5" font-size="11" font-weight="600">Replica</text>
      <text x="432" y="448" fill="#f3efe5" font-size="14">Model repository</text><text x="432" y="468" fill="#f3efe5" fill-opacity=".5" font-size="11" font-weight="600">Central · pre-loaded</text>
    </g>

    <!-- monitoring -->
    <rect x="52" y="504" width="564" height="38" rx="12" fill="#0d1220" stroke="#f3efe5" stroke-opacity=".3"/>
    <text x="334" y="528" fill="#f3efe5" fill-opacity=".8" font-size="12" font-weight="700" letter-spacing=".6">MONITORING  ·  Grafana / Prometheus  ·  Node · GPU · Service · K8s · DB</text>

    <!-- legend -->
    <text x="52" y="578" text-anchor="start" fill="#f3efe5" fill-opacity=".5" font-size="11" font-weight="600">Solid = Phase 1 online first  ·  Dashed = Phase 2 expansion (target)</text>

    <!-- title block -->
    <text x="690" y="62" text-anchor="start" fill="#c8b875" font-size="12" font-weight="800" letter-spacing="2.4">TARGET ARCHITECTURE</text>
    <text x="690" y="132" text-anchor="start" fill="#f3efe5" font-size="58" font-weight="800" letter-spacing="-2">4 + 1</text>
    <text x="690" y="164" text-anchor="start" fill="#f3efe5" font-size="14" font-weight="700">AMD compute pool + NVIDIA node</text>
    <text x="690" y="188" text-anchor="start" fill="#f3efe5" fill-opacity=".55" font-size="12" font-weight="600">3 Master/Worker + 1 Worker · 2 phases</text>
    <text x="690" y="208" text-anchor="start" fill="#f3efe5" fill-opacity=".55" font-size="12" font-weight="600">Open-source Kubernetes</text>

    <!-- firewall -->
    <rect x="652" y="28" width="22" height="584" rx="8" fill="#c8b875" fill-opacity=".08" stroke="#c8b875" stroke-opacity=".6" stroke-dasharray="5 4"/>
    <text transform="translate(668 170) rotate(-90)" fill="#c8b875" font-size="10" font-weight="800" letter-spacing="2.4">FIREWALL · SECURITY BOUNDARY</text>

    <!-- DMZ -->
    <rect x="690" y="326" width="242" height="250" rx="20" fill="#8fdc91" fill-opacity=".04" stroke="#8fdc91" stroke-opacity=".5"/>
    <text x="712" y="354" text-anchor="start" fill="#8fdc91" font-size="12" font-weight="800" letter-spacing="2.4">EXTERNAL / DMZ ZONE</text>
    <rect x="712" y="372" width="198" height="160" rx="14" fill="#0d1220" stroke="#8fdc91" stroke-opacity=".55"/>
    <text x="811" y="402" fill="#8fdc91" font-size="11" font-weight="800" letter-spacing="2">NVIDIA NODE · PHASE 1</text>
    <text x="811" y="434" fill="#f3efe5" font-size="17" font-weight="700">RTX PRO Blackwell</text>
    <text x="811" y="454" fill="#f3efe5" fill-opacity=".55" font-size="12" font-weight="600">workstation GPUs</text>
    <text x="811" y="488" fill="#f3efe5" fill-opacity=".8" font-size="11" font-weight="600">separate from the MI350X pool</text>
    <text x="811" y="506" fill="#f3efe5" fill-opacity=".8" font-size="11" font-weight="600">not a fifth identical worker</text>

    <!-- controlled interface -->
    <line x1="616" y1="444" x2="712" y2="444" stroke="#8fdc91" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ag)" marker-start="url(#ag)"/>
  </g>
</svg>
