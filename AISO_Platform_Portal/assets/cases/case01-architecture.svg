<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-label="4 + 1 heterogeneous AI architecture">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#92e2ff" stroke-opacity=".05"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c8b875"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8fdc91"/></marker>
  </defs>
  <rect width="960" height="640" rx="24" fill="#070a13"/>
  <rect width="960" height="640" rx="24" fill="url(#g)"/>
  <g font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" text-anchor="middle">
    <!-- users + gateway -->
    <rect x="360" y="28" width="240" height="44" rx="12" fill="#0d1220" stroke="#f3efe5" stroke-opacity=".35" stroke-dasharray="5 4"/>
    <text x="480" y="56" fill="#f3efe5" fill-opacity=".8" font-size="15" font-weight="600">Users / Applications</text>
    <line x1="480" y1="72" x2="480" y2="98" stroke="#c8b875" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="330" y="104" width="300" height="48" rx="12" fill="#0f1526" stroke="#f3efe5" stroke-opacity=".45"/>
    <text x="480" y="134" fill="#f3efe5" font-size="16" font-weight="700">Load Balancer / API Gateway</text>
    <!-- fan out -->
    <path d="M480 152V170M147 170H813M147 170V186M369 170V186M591 170V186M813 170V186" fill="none" stroke="#c8b875" stroke-width="1.5"/>
    <!-- main pool frame -->
    <rect x="28" y="186" width="904" height="222" rx="20" fill="#c8b875" fill-opacity=".05" stroke="#c8b875" stroke-opacity=".6"/>
    <text x="52" y="212" text-anchor="start" fill="#c8b875" font-size="12" font-weight="800" letter-spacing="2.4">MAIN AI INFRASTRUCTURE · ACTIVE-ACTIVE PRODUCTION POOL · HA / N+1</text>
    <g font-weight="700">
      <rect x="52" y="226" width="190" height="100" rx="14" fill="#0d1220" stroke="#f3efe5" stroke-opacity=".35"/>
      <rect x="274" y="226" width="190" height="100" rx="14" fill="#0d1220" stroke="#f3efe5" stroke-opacity=".35"/>
      <rect x="496" y="226" width="190" height="100" rx="14" fill="#0d1220" stroke="#f3efe5" stroke-opacity=".35"/>
      <rect x="718" y="226" width="190" height="100" rx="14" fill="#0d1220" stroke="#f3efe5" stroke-opacity=".35"/>
      <text x="147" y="254" fill="#c8b875" font-size="14" letter-spacing="2">X1 · AMD</text>
      <text x="369" y="254" fill="#c8b875" font-size="14" letter-spacing="2">X2 · AMD</text>
      <text x="591" y="254" fill="#c8b875" font-size="14" letter-spacing="2">X3 · AMD</text>
      <text x="813" y="254" fill="#c8b875" font-size="14" letter-spacing="2">X4 · AMD</text>
      <g fill="#f3efe5" font-size="17"><text x="147" y="281">8 × MI350X</text><text x="369" y="281">8 × MI350X</text><text x="591" y="281">8 × MI350X</text><text x="813" y="281">8 × MI350X</text></g>
      <g fill="#f3efe5" fill-opacity=".5" font-size="12" font-weight="600"><text x="147" y="305">288GB HBM3e each</text><text x="369" y="305">288GB HBM3e each</text><text x="591" y="305">288GB HBM3e each</text><text x="813" y="305">288GB HBM3e each</text></g>
    </g>
    <rect x="52" y="338" width="856" height="46" rx="12" fill="#7edcff" fill-opacity=".07" stroke="#7edcff" stroke-opacity=".45"/>
    <text x="480" y="366" fill="#bfeeff" font-size="14" font-weight="700" letter-spacing="1.2">2 × 400GbE FABRIC  ·  interconnect · shared storage · data traffic · redundancy / HA</text>
    <!-- pool to data layer -->
    <line x1="300" y1="408" x2="300" y2="444" stroke="#c8b875" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/>
    <!-- shared data layer -->
    <rect x="28" y="452" width="540" height="160" rx="18" fill="#0d1220" stroke="#f3efe5" stroke-opacity=".4" stroke-dasharray="6 4"/>
    <text x="52" y="482" text-anchor="start" fill="#c8b875" font-size="12" font-weight="800" letter-spacing="2.4">SHARED DATA LAYER</text>
    <g text-anchor="start" fill="#f3efe5" font-size="14" font-weight="600">
      <text x="52" y="512">Model Repository</text><text x="232" y="512">Knowledge Base</text><text x="404" y="512">RAG Documents</text>
      <text x="52" y="542">Vector DB</text><text x="232" y="542">Metadata DB</text><text x="404" y="542">Object / File Storage</text>
      <text x="52" y="572">Config</text><text x="232" y="572">Log / Monitoring</text><text x="404" y="572">Backup</text>
    </g>
    <text x="52" y="598" text-anchor="start" fill="#f3efe5" fill-opacity=".45" font-size="11" font-weight="600">Local NVMe per AMD node: model · dataset · inference cache</text>
    <!-- controlled interface -->
    <line x1="568" y1="532" x2="636" y2="532" stroke="#8fdc91" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ag)" marker-start="url(#ag)"/>
    <text x="602" y="520" fill="#8fdc91" font-size="10" font-weight="700">2 × 10GbE</text>
    <text x="602" y="552" fill="#8fdc91" fill-opacity=".7" font-size="9" font-weight="700">controlled</text>
    <!-- auxiliary -->
    <rect x="644" y="452" width="288" height="160" rx="18" fill="#8fdc91" fill-opacity=".05" stroke="#8fdc91" stroke-opacity=".55"/>
    <text x="668" y="482" text-anchor="start" fill="#8fdc91" font-size="12" font-weight="800" letter-spacing="2.4">AUXILIARY AI · X5</text>
    <text x="668" y="512" text-anchor="start" fill="#f3efe5" font-size="17" font-weight="700">4 × RTX PRO 5500</text>
    <text x="668" y="532" text-anchor="start" fill="#f3efe5" fill-opacity=".5" font-size="12" font-weight="600">NVIDIA Blackwell · Dell Precision 7875</text>
    <g text-anchor="start" fill="#f3efe5" fill-opacity=".85" font-size="13" font-weight="600">
      <text x="668" y="562">OCR · STT · Preprocessing</text>
      <text x="668" y="586">Multimodal · CUDA workload</text>
    </g>
  </g>
</svg>
